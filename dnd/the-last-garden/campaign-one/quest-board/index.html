<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("gate-pending")</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest Board &middot; The Last Garden — Campaign One &middot; VisTectus</title>
  <meta name="description" content="The party&rsquo;s quest board: the people, places, handouts and leads of the campaign, nailed up and tied together with twine.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../../../../art/VisTectus%20Logo%201.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Mono:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap">
  <link rel="stylesheet" href="../../world.css?v=20261013">
  <link rel="stylesheet" href="../../../assets/quest-board/quest-board.css?v=20261013">
</head>
<!-- The Quest Board. The markup is here; the script and styles are shared
     by every campaign (dnd/assets/quest-board/). The campaign id below is
     stored with every saved board and is the folder its pictures go in:
     do not change it once boards have been saved. -->
<body data-campaign="the-last-garden-campaign-one" data-campaign-name="The Last Garden — Campaign One" data-title="Quest Board">
<div id="app">
  <header id="topbar">
    <div class="qb-brand">
      <div class="qb-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 26"><path d="M4 4.5h16v17.5l-2.4-1.3-2.4 1.3-2.6-1.3-2.6 1.3-2.4-1.3L4 22z" fill="currentColor" opacity=".35"/><path d="M4 4.5h16v17.5l-2.4-1.3-2.4 1.3-2.6-1.3-2.6 1.3-2.4-1.3L4 22zM8 10h8M8 13.5h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="4.5" r="2.3" fill="currentColor"/></svg></div>
      <div class="qb-brand-text">
        <p class="qb-kicker">The Last Garden — Campaign One</p>
        <h1 id="boardTitle">No Board Open</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="../resources.html" title="Back to the campaign&rsquo;s resources">&larr; Resources</a>
      <button id="btnAccount" type="button" class="btn btn-ghost" style="display:none">Sign in</button>
      <button id="btnZone" type="button" class="btn btn-ghost" aria-pressed="false" title="Chalk out a section of the board">＋ Section</button>
      <button id="btnLoad" type="button" class="btn btn-ghost">Open…</button>
      <button id="btnNew" type="button" class="btn btn-ghost">New Board</button>
      <button id="btnSave" type="button" class="btn btn-primary">Save <span id="dirtyDot" class="dirty-dot" style="display:none" aria-label="unsaved changes"></span></button>
    </div>
  </header>
  <div id="main">
    <div id="boardWrap">
      <div id="boardScaler">
        <div id="board">
          <svg id="strings"></svg>
          <div id="sectionsLayer"></div>
          <div id="cardsLayer"></div>
          <div id="zonePreview"></div>
        </div>
      </div>
      <div id="zoomControls">
        <button id="zoomOut" type="button" class="btn btn-ghost btn-small" title="Zoom out" aria-label="Zoom out">－</button>
        <span id="zoomLabel" aria-live="polite">200%</span>
        <button id="zoomIn" type="button" class="btn btn-ghost btn-small" title="Zoom in" aria-label="Zoom in">＋</button>
        <button id="zoomReset" type="button" class="btn btn-ghost btn-small" title="Back to 200%">Reset</button>
      </div>
    </div>
    <button id="lockerTab" type="button" aria-controls="offboard" aria-expanded="true" title="Hide the satchel">›</button>
    <aside id="offboard" aria-label="Satchel">
      <h2>Satchel</h2>
      <p class="hint">Jot down a lead, then drag it onto the board. Drag from a notice&rsquo;s red nail to another notice to tie them together with twine.</p>
      <div class="type-tabs" id="typeTabs"></div>
      <div id="formStandard">
        <input id="inpName" placeholder="The lead…" aria-label="Lead" maxlength="60"/>
        <textarea id="inpNote" placeholder="Notes (optional)…" aria-label="Notes" maxlength="480" rows="3"></textarea>
      </div>
      <div id="formComment" style="display:none">
        <textarea id="inpCommentText" placeholder="Write your note…" aria-label="Note" maxlength="600" rows="4"></textarea>
      </div>
      <div id="formPicker" style="display:none">
        <p class="hint" id="pickerHint" style="margin:0 0 8px"></p>
      </div>
      <button id="btnAddOffboard" type="button" class="btn btn-primary btn-block">Put in the Satchel</button>
      <div class="legend" id="legend"></div>
      <div id="offboardList"></div>
      <div id="photoSection">
        <h3>Pictures <span class="photo-actions"><button type="button" id="photoUpload" title="Upload a picture">＋ Upload</button><button type="button" id="photoClearAll" title="Take every picture out of the satchel">Clear all</button></span></h3>
        <div id="photoList"></div>
      </div>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="photoUploadInput" accept="image/*" style="display:none">
<div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>
<div id="loadingOverlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div id="loadingText">Working…</div>
</div>

<!-- The campaign's NPCs, Maps and Handouts, for the Person / Place /
     Handout pickers (entries the DM has hidden are left out). -->
<script src="../assets/data/npcs.js?v=20261013"></script>
<script src="../assets/data/maps.js?v=20261013"></script>
<script src="../assets/data/documents.js?v=20261013"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../../builders/config.js?v=20261013"></script>
<script src="../../../../gate.js?v=20261013" data-chronicle="the-last-garden-campaign-one" data-unit="campaign" data-dm-label="Dungeon Master"></script>
<script src="../../../assets/quest-board/quest-board.js?v=20261013"></script>
</body>
</html>
