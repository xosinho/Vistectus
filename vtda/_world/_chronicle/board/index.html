<!DOCTYPE html>
<!-- Template for every Vampire: the Dark Ages chronicle made with the
     World Builder, served at /vtda/<world>/<chronicle>/board/ by the
     router (/router.js on /404.html) with {{WORLD_ID}} {{WORLD_NAME}}
     {{CHRONICLE_ID}} {{CHRONICLE_NAME}} filled in (HTML-escaped).
     The board itself is vtda/assets/intrigue-board/ (script and styles). -->
<html lang="en">
<head>
  <script>document.documentElement.classList.add("gate-pending")</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Intrigue Board · {{CHRONICLE_NAME}} · VisTectus</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../../../art/VisTectus%20Logo%201.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Mono:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<!-- The Vampire default colours and the world's own, then the board's
     own styles (an oaken table with vellum cards), which win. -->
<link rel="stylesheet" href="../../../_world/world.css?v=20261015">
<link rel="stylesheet" href="../../world.css?v=20261015">
<link rel="stylesheet" href="../../../assets/intrigue-board/intrigue-board.css?v=20261015">
</head>
<body data-world="{{WORLD_ID}}" data-world-name="{{WORLD_NAME}}" data-chronicle="{{CHRONICLE_ID}}" data-chronicle-name="{{CHRONICLE_NAME}}">
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 26 22"><path d="M2 7l5.5 5L13 2l5.5 10L24 7l-2.5 11h-17z"/><rect x="4" y="19" width="18" height="2.5" rx="1"/></svg></div>
      <div class="brand-text">
        <h1 id="boardTitle">No Board Open</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="../index.html" title="Back to the chronicle">&larr; The chronicle</a>
      <button id="btnAccount" class="btn btn-ghost" style="display:none">Sign in</button>
      <button id="btnZone" class="btn btn-ghost">＋ Zone</button>
      <button id="btnLoad" class="btn btn-ghost">Open…</button>
      <button id="btnNew" class="btn btn-ghost">New Board</button>
      <button id="btnSave" class="btn btn-primary">Save <span id="dirtyDot" class="dirty-dot" style="display:none"></span></button>
    </div>
  </header>
  <div id="main">
    <div id="boardWrap">
      <div id="boardScaler">
        <div id="board">
          <svg id="strings"></svg>
          <div id="sectionsLayer"></div>
          <div id="cardsLayer"></div>
          <div id="zonePreview"></div>
        </div>
      </div>
      <div id="zoomControls">
        <button id="zoomOut" class="btn btn-ghost btn-small" title="Zoom out">－</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" class="btn btn-ghost btn-small" title="Zoom in">＋</button>
        <button id="zoomReset" class="btn btn-ghost btn-small" title="Reset zoom">Reset</button>
      </div>
    </div>
    <button id="lockerTab" type="button" aria-controls="offboard" aria-expanded="true" title="Hide the evidence coffer">›</button>
    <aside id="offboard">
      <h2>Evidence Coffer</h2>
      <p class="hint">Write down a suspicion, then drag it onto the board. Drag from a card's red seal to link two suspicions.</p>
      <div class="type-tabs" id="typeTabs"></div>
      <div id="formStandard">
        <input id="inpName" placeholder="Name…" maxlength="60"/>
        <textarea id="inpNote" placeholder="Notes (optional)…" maxlength="480" rows="3"></textarea>
      </div>
      <div id="formComment" style="display:none">
        <textarea id="inpCommentText" placeholder="Write your note…" maxlength="600" rows="4"></textarea>
      </div>
      <div id="formPicker" style="display:none">
        <p class="hint" id="pickerHint" style="margin:0 0 8px"></p>
      </div>
      <div id="formPhoto" style="display:none">
        <p class="hint" style="margin:0 0 8px">Pictures go to the Pictures section below — drag from there onto the board.</p>
      </div>
      <button id="btnAddOffboard" class="btn btn-primary btn-block">Put in the Coffer</button>
      <div class="legend" id="legend"></div>
      <div id="offboardList"></div>
      <div id="photoSection">
        <h3>Pictures <span><span id="photoUpload" style="cursor:pointer;font-size:9px;margin-right:10px;" title="Upload a picture">＋ Upload</span><span id="photoClearAll" style="cursor:pointer;font-size:9px;opacity:0.6;" title="Clear all pictures">Clear all</span></span></h3>
        <div id="photoList"><div id="photoEmpty" style="font-family:var(--mono);font-size:11px;color:#6e6350;text-align:center;padding:6px 0">No pictures uploaded yet.</div></div>
      </div>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="photoUploadInput" accept="image/*" style="display:none">
<div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>
<div id="loadingOverlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div id="loadingText">Working…</div>
</div>

<!-- Boards are saved online in the case_files table and the case-photos
     bucket, kept apart by chronicle (rules: admin/sql/access.sql).
     The Person / Place / Document pickers offer the chronicle's NPCs,
     Maps and Documents from the workshop; hidden ones are left out. -->
<script>window.VAMPIRE_NPCS = []; window.VAMPIRE_MAPS = []; window.VAMPIRE_DOCUMENTS = [];</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../../builders/config.js?v=20261015"></script>
<script src="../../../../gate.js?v=20261015" data-chronicle="{{CHRONICLE_ID}}"></script>
<script src="../../../../content.js?v=20261015"></script>
<script src="../../../assets/intrigue-board/intrigue-board.js?v=20261015"></script>
</body>
</html>
