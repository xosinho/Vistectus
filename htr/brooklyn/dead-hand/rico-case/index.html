<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("gate-pending", "gate-all")</script>
  <style>html.gate-pending main, html.gate-pending.gate-all body > *:not(.gate-box) { visibility: hidden !important; }</style>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RICO Case · The Dead Hand · VisTectus</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/art/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<!-- The board's cork-and-string look, shared with every Hunter
     chronicle's case board. -->
<link rel="stylesheet" href="../../../assets/case-board/case-board.css?v=202610131552">
</head>
<!-- The RICO Case board. Drawn and run by the shared Hunter case board,
     htr/assets/case-board/case-board.js, which opens the case file named
     here (data-board-name; its saved versions are kept under "rico-case").
     Who may save and delete is decided by the database (board_editor in
     admin/sql/access.sql); data-board-editors only says so on the page. -->
<body data-chronicle="dead-hand" data-chronicle-name="The Dead Hand"
      data-world="brooklyn" data-world-name="Brooklyn"
      data-board-name="RICO Case"
      data-board-editors="Vivienne’s and Ezekiel’s players and the Storyteller">
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-text">
        <h1 id="boardTitle">No Case File Loaded</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="../players.html" title="Back to the cell">&larr; The cell</a>
      <button id="btnAccount" class="btn btn-ghost" style="display:none">Sign in</button>
      <button id="btnZone" class="btn btn-ghost">＋ Zone</button>
      <button id="btnLoad" class="btn btn-ghost">Open…</button>
      <button id="btnNew" class="btn btn-ghost">New Case</button>
      <button id="btnSave" class="btn btn-primary">Save <span id="dirtyDot" class="dirty-dot" style="display:none"></span></button>
    </div>
  </header>
  <div id="main">
    <div id="boardWrap">
      <div id="boardScaler">
        <div id="board">
          <svg id="strings"></svg>
          <div id="sectionsLayer"></div>
          <div id="cardsLayer"></div>
          <div id="zonePreview"></div>
        </div>
      </div>
      <div id="zoomControls">
        <button id="zoomOut" class="btn btn-ghost btn-small" title="Zoom out">－</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" class="btn btn-ghost btn-small" title="Zoom in">＋</button>
        <button id="zoomReset" class="btn btn-ghost btn-small" title="Reset zoom">Reset</button>
      </div>
    </div>
    <button id="lockerTab" type="button" aria-controls="offboard" aria-expanded="true" title="Hide the evidence locker">›</button>
    <aside id="offboard">
      <h2>Evidence Locker</h2>
      <p class="hint">Build a lead, then drag it onto the board. Drag from a card's red pin to link two leads.</p>
      <div class="type-tabs" id="typeTabs"></div>
      <div id="formStandard">
        <input id="inpName" placeholder="Name…" maxlength="60"/>
        <textarea id="inpNote" placeholder="Notes (optional)…" maxlength="480" rows="3"></textarea>
      </div>
      <div id="formComment" style="display:none">
        <textarea id="inpCommentText" placeholder="Write your note…" maxlength="600" rows="4"></textarea>
      </div>
      <div id="formPicker" style="display:none">
        <p class="hint" id="pickerHint" style="margin:0 0 8px"></p>
      </div>
      <div id="formPhoto" style="display:none">
        <p class="hint" style="margin:0 0 8px">Photos go to the Photos section below — drag from there onto the board.</p>
      </div>
      <button id="btnAddOffboard" class="btn btn-primary btn-block">Pin to Locker</button>
      <div class="legend" id="legend"></div>
      <div id="offboardList"></div>
      <div id="photoSection">
        <h3>Photos <span><span id="photoUpload" style="cursor:pointer;font-size:9px;margin-right:10px;" title="Upload a photo">＋ Upload</span><span id="photoClearAll" style="cursor:pointer;font-size:9px;opacity:0.6;" title="Clear all photos">Clear all</span></span></h3>
        <div id="photoList"><div id="photoEmpty" style="font-family:var(--mono);font-size:11px;color:#6e6350;text-align:center;padding:6px 0">No photos uploaded yet.</div></div>
      </div>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="photoUploadInput" accept="image/*" style="display:none">
<div id="toast" class="toast" role="status" aria-live="polite" style="display:none"></div>
<div id="loadingOverlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div id="loadingText">Working…</div>
</div>

<!-- Case files are saved online in the site's Supabase project, the
     same one the Builders area uses: its address and public key are read
     from builders/config.js. Setup: see the chronicle README. -->
<!-- The site's people, maps and documents, for the Person / Place /
     Document pickers, joined by those added in the workshop. Hidden
     entries are left out (archive_hidden). -->
<script src="../assets/data/npcs.js?v=202610131552"></script>
<script src="../assets/data/maps.js?v=202610131552"></script>
<script src="../assets/data/documents.js?v=202610131552"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="../../../../builders/config.js?v=202610131552"></script>
<script src="../../../../gate.js?v=202610131552" data-chronicle="dead-hand"></script>
<script src="../../../../content.js?v=202610131552"></script>
<script src="../../../assets/case-board/case-board.js?v=202610131552"></script>
</body>
</html>
